<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研究計画 — 案1修正版</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="revised.css"></head>
<body><header class="top"><span class="name">研究計画</span><span class="sample" id="sample">比較用・仮データ</span><a href="compare.html" id="previous">初稿と比較</a><button id="language" type="button">English</button></header>
<div class="workspace"><nav id="projects" aria-label="プロジェクト"></nav><main id="main"><div class="page-heading"><h1 id="heading">今週</h1><p id="range"></p></div><label class="mobile-project"><span id="mobile-project-label">プロジェクト</span><select id="mobile-project"></select></label><div class="view-controls"><div id="views" role="group" aria-label="期間"></div><label class="search"><span id="search-label">検索</span><input id="search" type="search" autocomplete="off"></label></div><div id="notice" role="status"></div><div id="table"></div><div id="legend"></div><details id="undated"><summary></summary><div></div></details><details id="recent"></details></main></div>
<dialog id="detail" aria-labelledby="task-name"><form id="record"><header><p id="project-name"></p><button type="button" id="close" aria-label="閉じる">×</button></header><h2 id="task-name"></h2><dl id="task-meta"></dl><label id="work-label">作業内容<textarea name="summary" required rows="3"></textarea></label><label id="feedback-label">フィードバック<textarea name="feedback" rows="2"></textarea></label><label id="time-label">実作業時間（分・任意）<input name="minutes" type="number" min="0" inputmode="numeric"></label><footer><button type="submit" id="save">保存</button><button type="submit" id="complete" name="complete" value="yes">完了にする</button></footer><p id="save-status" role="status"></p></form></dialog>
<script type="module" src="revised.mjs"></script></body></html>
