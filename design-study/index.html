<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研究ロードマップ — 比較</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="study.css"></head><body><aside class="review-toolbar" aria-label="比較の設定"><strong>比較用・仮データ</strong><label>案<select id="option"><option value="a">1</option><option value="b">2</option><option value="c">3</option></select></label><label>表示<select id="view"><option value="week">今週</option><option value="quarter">3か月</option><option value="all">博士全体</option></select></label><label>言語<select id="lang"><option value="ja">日本語</option><option value="en">English</option></select></label><label>状態<select id="scenario"><option value="normal">通常</option><option value="empty">予定なし</option><option value="error">取得失敗</option><option value="crowded">締切の集中</option></select></label><button id="reset">仮データを戻す</button><button id="specimen">配色・文字</button><a href="studies/index.html">再現練習</a></aside><main id="app"></main><dialog id="detail" aria-labelledby="detail-title"><form id="worklog"><header><h2 id="detail-title"></h2><button type="button" id="close" aria-label="閉じる">×</button></header><div id="detail-meta"></div><label id="summary-label">作業内容<textarea name="summary" required rows="3"></textarea></label><label id="feedback-label">フィードバック<textarea name="feedback" rows="2"></textarea></label><label id="minutes-label">実作業時間（分・任意）<input type="number" name="minutes" min="0" inputmode="numeric"></label><button type="submit" id="save">保存</button><p role="status" id="save-status"></p><p id="simulation-note">仮データの操作確認です。外部サービスには送信しません。</p></form></dialog><script type="module" src="preview.mjs"></script></body></html>
