<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3案の比較</title><style>*{box-sizing:border-box}body{margin:0;background:#e8ebed;color:#20303d;font:15px/1.6 sans-serif}header{padding:18px 24px;background:#fff;border-bottom:1px solid #bbc5cc}h1{margin:0;font-size:22px}header p{margin:4px 0 0}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:18px}article{min-width:0}h2{font-size:18px;margin:0 0 6px}a{color:#13568f}article p{margin:6px 0 12px;min-height:48px}.preview{height:445px;overflow:hidden;background:white;border:1px solid #c5cdd3;position:relative}iframe{width:1280px;height:1420px;border:0;transform-origin:top left;pointer-events:none}.links{display:flex;gap:12px;flex-wrap:wrap}@media(max-width:700px){main{grid-template-columns:1fr}.preview{height:400px}}a:focus-visible{outline:3px solid #176dc1}</style></head><body><header><h1>3案の比較</h1><p>同じ仮データを使用。各案の「今週・3か月・博士全体」と日英を切り替えて確認できます。</p></header><main></main><script type="module">
const texts=['プロジェクト一覧と時間軸を並べる。','研究の段階・成果・判断点を図で読む。','週間予定・作業・記録を並べる。'];
for(const [i,id]of ['a','b','c'].entries()){const a=document.createElement('article');a.innerHTML=`<h2>案${i+1}</h2><p>${texts[i]}</p><div class="preview"><iframe title="案${i+1}の週間表示" src="./?option=${id}&view=week&lang=ja&scenario=normal"></iframe></div><p class="links"><a href="./?option=${id}&view=week&lang=ja">今週</a><a href="./?option=${id}&view=quarter&lang=ja">3か月</a><a href="./?option=${id}&view=all&lang=ja">博士全体</a><a href="./?option=${id}&view=week&lang=en">English</a></p>`;document.querySelector('main').append(a);}
function size(){document.querySelectorAll('.preview').forEach(p=>p.querySelector('iframe').style.transform=`scale(${p.clientWidth/1280}) translateY(-55px)`)}window.addEventListener('resize',size);size();
</script></body></html>
